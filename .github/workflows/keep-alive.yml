# Pings the live site's /api/health endpoint every 3 days.
# The endpoint runs one tiny database query, which keeps a Supabase
# Free-plan project from auto-pausing after 7 days without activity
# (a paused project silently stops saving new leads).
#
# For a new business: change SITE_URL below to the owner's domain.
# No secrets are needed — the site itself holds the database keys.
name: Keep database awake

on:
  schedule:
    - cron: "17 3 */3 * *" # 03:17 UTC every 3rd day
  workflow_dispatch: {}

env:
  SITE_URL: https://invisprotect.in

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call health endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" --retry 3 --retry-delay 20 "$SITE_URL/api/health")
          echo "HTTP $status"; cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::warning::Health check returned $status — check the site and database."
          fi
